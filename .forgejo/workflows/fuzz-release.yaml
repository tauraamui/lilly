name: Fuzz release

# Fuzzes the binaries attached to a release, as users download them, on each
# platform they are built for. Runs once the draft release.yaml made is
# published, so it never holds a release up; a failure here means a release
# is out with a crash or hang in it, to fix in the next one.
#
#   Linux amd64     this forge's runner, in the CI image
#   Linux arm64     the same, under qemu-user
#   macOS arm64     the self-hosted Mac runner
#   macOS amd64     the same, under Rosetta
#   Windows amd64   not here: no runner can host it. `v run make.vsh
#                   windows-vm-fuzz` runs the same fuzzer in a local VM
#
# cmd/fuzz drives each binary in a pty with random keys on random and mutated
# files, failing a run if lilly dies, logs a panic, or stops redrawing. Every
# failing run is saved, with what it was given and the steps that broke it,
# and uploaded as the job's artifact; replay one locally with the command in
# its info.txt. A hang also saves stacks.txt, where each of lilly's threads
# was when it stopped.
#
# The release binaries are built with -prod and no glibc backtrace support,
# so a panic in one says what went wrong but not where. fuzz-linux-debug
# builds the tag's source with -g alongside, whose panics resolve to source
# lines in backtrace.txt.
#
# The fuzzer and its corpus come from the commit this workflow runs from, not
# the tag, so a better fuzzer can be pointed at an older release with
# workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to fuzz (drafts too)'
        required: true
        type: string
      duration:
        description: 'How long to fuzz each binary, e.g. 20m or 1h'
        required: false
        type: string
        default: '20m'

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  DURATION: ${{ inputs.duration || '20m' }}

jobs:
  fuzz-linux:
    name: Fuzz (${{ matrix.asset }})
    runs-on: ubuntu-latest
    container:
      image: registry.catkin.dev/tauraamui/lilly-ci:latest
      credentials:
        username: ${{ vars.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    # covers a dispatch of a few hours; the fuzzing stops itself at DURATION
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: lilly-linux-amd64
            run_as: ''
            timeout_scale: '1'
            extra_packages: ''
          # The binary is static, so qemu-user runs it without an arm64
          # sysroot. Emulation is several times slower, hence the scale.
          - asset: lilly-linux-arm64
            run_as: qemu-aarch64
            timeout_scale: '4'
            extra_packages: qemu-user
    steps:
      - uses: actions/checkout@v4

      - name: Install extra packages
        if: matrix.extra_packages != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${{ matrix.extra_packages }}

      # The token is only needed to find a draft, when dispatched for one
      - name: Fetch release binary
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
        run: node .forgejo/scripts/fetch-release-assets.mjs "$TAG" ${{ matrix.asset }}

      - name: Build fuzzer
        run: v -prod cmd/fuzz -o fuzz

      - name: Fuzz
        run: ./fuzz --duration "$DURATION" --timeout-scale ${{ matrix.timeout_scale }} --out fuzz_out -- ${{ matrix.run_as }} ./${{ matrix.asset }}

      # Forgejo's fork: actions/upload-artifact@v4 sees a non-github.com
      # server as GHES and refuses to upload
      - name: Upload failures
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.asset }}
          path: |
            fuzz_out/summary.txt
            fuzz_out/failures/

  # The tag's source built for debugging rather than as released: -g without
  # -prod, so frames are not inlined away, and -d glibc, so V prints a
  # backtrace on a panic. Static like the release, and unoptimised, so slower,
  # hence the larger timeout scales. gdb is for the stacks a hang saves.
  fuzz-linux-debug:
    name: Fuzz (lilly-linux-${{ matrix.arch }}, debug build)
    runs-on: ubuntu-latest
    container:
      image: registry.catkin.dev/tauraamui/lilly-ci:latest
      credentials:
        username: ${{ vars.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            v_flags: -g -d glibc -cc gcc -cflags -static
            run_as: ''
            timeout_scale: '2'
            extra_packages: gdb
            addr2line: addr2line
          - arch: arm64
            v_flags: -g -d glibc -arch arm64 -cc aarch64-linux-gnu-gcc -cflags -static
            run_as: qemu-aarch64
            timeout_scale: '8'
            extra_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
            addr2line: aarch64-linux-gnu-addr2line
    env:
      BINARY: lilly-linux-${{ matrix.arch }}-debug
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the tag's source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: tag-src

      - name: Install extra packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${{ matrix.extra_packages }}

      # as release.yaml builds it: fresh dependencies, and the tag's hash for -v
      - name: Build debug binary
        working-directory: tag-src
        run: |
          v install
          git log -n 1 --pretty=format:"%h" > .githash
          v ${{ matrix.v_flags }} . -o "../$BINARY"

      - name: Build fuzzer
        run: v -prod cmd/fuzz -o fuzz

      - name: Fuzz
        run: ./fuzz --duration "$DURATION" --timeout-scale ${{ matrix.timeout_scale }} --out fuzz_out -- ${{ matrix.run_as }} ./"$BINARY"

      - name: Symbolize backtraces
        if: failure()
        run: sh .forgejo/scripts/symbolize-backtraces.sh "./$BINARY" ${{ matrix.addr2line }} fuzz_out/failures

      # the binary too, so any address in a failure can be looked up later
      - name: Upload failures
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: fuzz-${{ env.BINARY }}
          path: |
            fuzz_out/summary.txt
            fuzz_out/failures/
            ${{ env.BINARY }}

  # Runs directly on the Mac, as release.yaml's macOS jobs do. One arm64
  # fuzzer drives both binaries: the amd64 one runs under Rosetta when the
  # fuzzer starts it.
  fuzz-macos:
    name: Fuzz (lilly-darwin-${{ matrix.arch }})
    runs-on: macos
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            timeout_scale: '1'
          - arch: amd64
            timeout_scale: '2'
    env:
      ASSET: lilly-darwin-${{ matrix.arch }}
      V_C_ERROR_BUG_REPORT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      # The arm64 V release.yaml builds and caches, built here the same way
      # if this Mac has not built one for the pinned refs yet. See the Build V
      # step there for why it is built in place and under LC_ALL=C.
      - name: Build V
        run: |
          containerfile=.forgejo/ci-image/Containerfile
          V_REF=$(sed -n 's/^ARG V_REF=//p' "$containerfile")
          VC_REF=$(sed -n 's/^ARG VC_REF=//p' "$containerfile")
          if [ -z "$V_REF" ] || [ -z "$VC_REF" ]; then
            echo "::error::ARG V_REF and ARG VC_REF must both be set in $containerfile"
            exit 1
          fi
          vdir="$HOME/Library/Caches/lilly-release/v-arm64-$V_REF-$VC_REF"
          if [ ! -f "$vdir/.built" ]; then
            rm -rf "$vdir"
            LC_ALL=C bash .forgejo/ci-image/build-v.sh "$vdir" "$V_REF" "$VC_REF"
            touch "$vdir/.built"
          fi
          "$vdir/v" version
          echo "VEXE=$vdir/v" >> "${FORGEJO_ENV:-$GITHUB_ENV}"

      - name: Fetch release binary
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
        run: node .forgejo/scripts/fetch-release-assets.mjs "$TAG" "$ASSET"

      - name: Build fuzzer
        run: '"$VEXE" -prod -cc clang cmd/fuzz -o fuzz'

      - name: Fuzz
        run: ./fuzz --duration "$DURATION" --timeout-scale ${{ matrix.timeout_scale }} --out fuzz_out -- ./"$ASSET"

      - name: Upload failures
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: fuzz-${{ env.ASSET }}
          path: |
            fuzz_out/summary.txt
            fuzz_out/failures/
