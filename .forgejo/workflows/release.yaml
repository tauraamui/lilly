name: Release

# Builds lilly for a version tag and attaches every binary to a draft release
# here on the forge. Review and publish the draft once every asset has arrived.
#
#   Linux amd64/arm64, Windows amd64   this forge's runner, in the CI image
#   macOS arm64/amd64                  a self-hosted runner on a Mac, labelled
#                                      `macos`, which runs jobs on the host
#
# The macOS jobs wait in the queue until that runner is online, and never hold
# up the others. Forgejo abandons a job no runner has picked up within a day,
# so if the Mac was off for longer, rebuild the tag with workflow_dispatch.
#
# The tag must match the version in v.mod. Each job calls
# .forgejo/scripts/publish-release.mjs, which creates the draft if no job has
# yet, so the jobs need no ordering between them.
#
# Requires the FORGE_RELEASE_TOKEN secret: an access token with
# write:repository on this repo.
on:
  push:
    tags:
      - '*v[0-9]*.[0-9]*.[0-9]*'
  # Rebuilds an existing tag, with the release tooling as it is on the branch
  # dispatched from, so a fix to the release build can be retried without
  # moving the tag. Assets already on the release are replaced.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true
        # Forgejo's dispatch form rejects an input without a type
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-version:
    name: Validate tag vs v.mod version
    runs-on: ubuntu-latest
    container:
      image: registry.catkin.dev/tauraamui/lilly-ci:latest
      credentials:
        username: ${{ vars.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches v.mod version
        run: |
          VMOD_VERSION=$(sed -n "s/^[[:space:]]*version: '\([^']*\)'.*/\1/p" v.mod)
          echo "Tag:           $TAG"
          echo "v.mod version: $VMOD_VERSION"
          if [ "$TAG" != "$VMOD_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match v.mod version '$VMOD_VERSION'. Update v.mod before tagging."
            exit 1
          fi

  build:
    name: Build (${{ matrix.artifact_suffix }})
    needs: validate-version
    runs-on: ubuntu-latest
    container:
      image: registry.catkin.dev/tauraamui/lilly-ci:latest
      credentials:
        username: ${{ vars.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked. The image is Debian 13, whose glibc 2.41 and
          # gcc 14 have strtol and friends resolve to the C23 symbols added in
          # glibc 2.38, so a dynamic build would not start on Debian 12,
          # Ubuntu 22.04 or anything else older. Static glibc still loads the
          # host's NSS modules for getaddrinfo and getpw*, and a host module
          # drags in a second, mismatched libc that crashes the process. Lilly
          # must not resolve hostnames or look up users through NSS.
          - artifact_suffix: linux-amd64
            output: lilly-linux-amd64
            v_flags: -prod -cc gcc -cflags -static
            extra_packages: ''
            smoke_test: ./lilly-linux-amd64 -v
          # Cross-compiled, and static for the same reason as amd64. Being
          # static, it runs under qemu-user without an arm64 sysroot.
          - artifact_suffix: linux-arm64
            output: lilly-linux-arm64
            v_flags: -prod -arch arm64 -cc aarch64-linux-gnu-gcc -cflags -static
            extra_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
            smoke_test: qemu-aarch64 ./lilly-linux-arm64 -v
          # V3 only targets macOS, Linux and BSD, so this goes through the
          # older compiler. No smoke test: there is nothing here to run it.
          - artifact_suffix: windows-amd64
            output: lilly-windows-amd64.exe
            v_flags: -prod -os windows -cc x86_64-w64-mingw32-gcc
            extra_packages: mingw-w64
            smoke_test: ''
    steps:
      # full history and tags, for the changelog in the release body
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # The upload script comes from the commit this workflow runs from, not
      # the tag. On a tag push they are the same commit; on a dispatch it lets
      # a tag cut before a tooling fix be rebuilt with that fix.
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: .forgejo

      # Cross toolchains are installed here rather than baked into the image,
      # so the image every regular CI job pulls does not grow for jobs that
      # only run on a tag.
      - name: Install extra packages
        if: matrix.extra_packages != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${{ matrix.extra_packages }}

      # No ~/.vmodules cache, unlike ci.yaml: `v install` leaves an installed
      # module as it is, so a restored cache would ship whatever bobatea and
      # kdlv were when it was saved rather than what they are now.
      - name: Install dependencies
        run: v install

      - name: Generate git hash
        run: git log -n 1 --pretty=format:"%h" | tee ./.githash

      - name: Build
        timeout-minutes: 20
        run: v ${{ matrix.v_flags }} . -o ${{ matrix.output }}

      - name: Smoke test
        if: matrix.smoke_test != ''
        run: ${{ matrix.smoke_test }}

      - name: Checksum
        run: sha256sum ${{ matrix.output }} | tee ${{ matrix.output }}.sha256

      - name: Upload to release
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
        run: node .release-tooling/.forgejo/scripts/publish-release.mjs "$TAG" ${{ matrix.output }} ${{ matrix.output }}.sha256

  # Runs directly on the Mac, not in a container: building for macOS needs
  # Apple's SDK, which is licensed for Apple hardware only. One Apple Silicon
  # Mac builds both: arm64 natively, and amd64 with an x86_64 V toolchain run
  # under Rosetta, so its compiler emits x86_64 without any cross flags.
  #
  # The Mac needs the Xcode Command Line Tools, Rosetta, git and node on the
  # runner's PATH. See the runner setup note.
  build-macos:
    name: Build (darwin-${{ matrix.arch }})
    needs: validate-version
    runs-on: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            run_as: ''
          - arch: amd64
            run_as: arch -x86_64
    env:
      OUTPUT: lilly-darwin-${{ matrix.arch }}
      # The oldest macOS the binaries start on. 11 is the first with Apple
      # Silicon support, and clang reads this for both architectures.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # as the CI image sets it: no uploads to bugs.vlang.io on a failed build
      V_C_ERROR_BUG_REPORT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: .forgejo

      # V is built once per architecture and pinned commit pair, from the same
      # refs and script as the CI image, then reused by later releases, so it
      # lives under ~/Library/Caches rather than the job's work directory.
      # LC_ALL=C because the macOS bootstrap pipes
      # vc/v.c through BSD awk, which aborts on non-UTF-8 bytes in a UTF-8
      # locale and hands clang a truncated file ("_main" undefined).
      - name: Build V
        run: |
          containerfile=.release-tooling/.forgejo/ci-image/Containerfile
          V_REF=$(sed -n 's/^ARG V_REF=//p' "$containerfile")
          VC_REF=$(sed -n 's/^ARG VC_REF=//p' "$containerfile")
          if [ -z "$V_REF" ] || [ -z "$VC_REF" ]; then
            echo "::error::ARG V_REF and ARG VC_REF must both be set in $containerfile"
            exit 1
          fi
          # Built where it will stay: V records its own absolute path for the
          # files it embeds, so a V built elsewhere and moved here panics
          # ("EmbedFileData error") on its first compile. The .built marker
          # tells a finished build from one interrupted part way.
          vdir="$HOME/Library/Caches/lilly-release/v-${{ matrix.arch }}-$V_REF-$VC_REF"
          if [ ! -f "$vdir/.built" ]; then
            rm -rf "$vdir"
            LC_ALL=C ${{ matrix.run_as }} bash .release-tooling/.forgejo/ci-image/build-v.sh "$vdir" "$V_REF" "$VC_REF"
            touch "$vdir/.built"
          fi
          ${{ matrix.run_as }} "$vdir/v" version
          echo "VEXE=$vdir/v" >> "${FORGEJO_ENV:-$GITHUB_ENV}"

      # A fresh module directory per job: a shared ~/.vmodules would be both
      # stale (`v install` leaves installed modules alone) and raced by the two
      # architectures building at once on a runner with capacity over 1.
      - name: Install dependencies
        run: |
          export VMODULES="$PWD/.vmodules"
          rm -rf "$VMODULES"
          ${{ matrix.run_as }} "$VEXE" install

      - name: Generate git hash
        run: git log -n 1 --pretty=format:"%h" | tee ./.githash

      - name: Build
        timeout-minutes: 20
        run: |
          export VMODULES="$PWD/.vmodules"
          ${{ matrix.run_as }} "$VEXE" -prod -cc clang . -o "$OUTPUT"
          file "$OUTPUT"

      # amd64 runs under Rosetta
      - name: Smoke test
        run: ./"$OUTPUT" -v

      - name: Checksum
        run: shasum -a 256 "$OUTPUT" | tee "$OUTPUT.sha256"

      - name: Upload to release
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_RELEASE_TOKEN }}
        run: node .release-tooling/.forgejo/scripts/publish-release.mjs "$TAG" "$OUTPUT" "$OUTPUT.sha256"
