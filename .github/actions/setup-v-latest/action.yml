  name: Setup V (latest master)
  description: Builds V from source with a daily cache

  inputs:
    build-if-missing:
      description: >
        When 'false', fail instead of building V from source. Consuming jobs
        set this so that only the dedicated setup-v job ever pays the
        bootstrap cost.
      required: false
      default: 'true'

  runs:
    using: composite
    steps:
      - name: Get date
        id: date
        shell: bash
        run: echo "value=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache V compiler
        id: cache_v
        uses: actions/cache@v4
        with:
          path: ~/v
          key: v-master-${{ steps.date.outputs.value }}
          # Fall back to any previous day's V rather than rebuilding from
          # scratch. Without this a single cold cache makes every job in the
          # run bootstrap V independently.
          restore-keys: |
            v-master-

      # cache-hit is only 'true' on an exact key match, so a restore-keys hit
      # still reports false. Ask the filesystem instead of trusting that.
      - name: Detect usable V
        id: detect
        shell: bash
        run: |
          if [ -x "$HOME/v/v" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail fast if V is missing
        if: steps.detect.outputs.present != 'true' && inputs.build-if-missing != 'true'
        shell: bash
        run: |
          echo "::error::No cached V available and build-if-missing=false. The setup-v job should have populated this cache." >&2
          exit 1

      - name: Build or refresh V from source
        if: inputs.build-if-missing == 'true' && steps.cache_v.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -u
          # Keep any V restored via restore-keys so we can fall back to it.
          if [ -x "$HOME/v/v" ]; then
            rm -rf "$HOME/v.prev"
            mv "$HOME/v" "$HOME/v.prev"
          fi
          ok=0
          if git clone --depth=1 https://github.com/vlang/v "$HOME/v"; then
            # Bootstrapping V can grow without bound, notably on the v1
            # fallback path taken when the bundled TCC is not host-compatible
            # (stage 2 runs with -gc none, so nothing is reclaimed). Cap it so
            # a runaway bootstrap fails this step rather than taking the
            # entire runner host down.
            if ( cd "$HOME/v" && ulimit -v 4194304 && make ); then
              ok=1
            fi
          fi
          if [ "$ok" = "1" ]; then
            rm -rf "$HOME/v.prev"
          else
            echo "::warning::V master build failed; falling back to previously cached V if available"
            rm -rf "$HOME/v"
            if [ -d "$HOME/v.prev" ]; then
              mv "$HOME/v.prev" "$HOME/v"
            fi
            if [ ! -x "$HOME/v/v" ]; then
              echo "::error::V build failed and no cached V to fall back to." >&2
              exit 1
            fi
          fi

      - name: Add V to PATH
        shell: bash
        run: echo "$HOME/v" >> $GITHUB_PATH
